<!DOCTYPE html>
<html>
<head>
  <title>10 Day Countdown</title>
</head>
<body>
  <h2>Countdown Timer</h2>
  <p id="timer"></p>
  <img src="images/WhatsApp Image 2025-09-09 at 10.38.02 AM.jpeg" width="100%" height="100%">
  

  <script>
    // Set the countdown for 10 days from now
    var countDownDate = new Date().getTime() + (10 * 24 * 60 * 60 * 1000);

    // Update every second
    var x = setInterval(function() {
      var now = new Date().getTime();
      var distance = countDownDate - now;

      // Time calculations
      var days = Math.floor(distance / (1000 * 60 * 60 * 24));
      var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      var seconds = Math.floor((distance % (1000 * 60)) / 1000);

      // Display result
      document.getElementById("timer").innerHTML =
        days + "d " + hours + "h " + minutes + "m " + seconds + "s ";

      // When countdown is finished
      if (distance < 0) {
        clearInterval(x);
        document.getElementById("timer").innerHTML = "EXPIRED";
      }
    }, 1000);
  </script>
</body>
</html>
